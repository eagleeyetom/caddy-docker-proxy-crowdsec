name: Check and Update Versions

on:
  schedule:
    - cron: '0 0 * * *' # Run every day at midnight UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  packages: write

jobs:
  update-versions:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.update.outputs.updated }}
      tag_name: ${{ steps.update.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch latest versions
        id: versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch all remote tags to ensure tag existence check works reliably
          git fetch --tags origin

          get_latest_release() {
            local repo="$1"
            local tag
            # Use GitHub CLI with GITHUB_TOKEN to avoid unauthenticated API rate limits
            tag=$(gh release view -R "$repo" --json tagName -q .tagName 2>/dev/null | sed 's/^v//')

            if [ -z "$tag" ] || [ "$tag" = "null" ] || ! [[ "$tag" =~ ^[0-9]+ ]]; then
              echo "Error: Failed to fetch valid release tag for '$repo' (got: '$tag')" >&2
              return 1
            fi
            echo "$tag"
          }

          CADDY_LATEST=$(get_latest_release "caddyserver/caddy")
          CDP_LATEST=$(get_latest_release "lucaslorentz/caddy-docker-proxy")
          BOUNCER_LATEST=$(get_latest_release "hslatman/caddy-crowdsec-bouncer")

          echo "caddy=$CADDY_LATEST" >> $GITHUB_OUTPUT
          echo "cdp=$CDP_LATEST" >> $GITHUB_OUTPUT
          echo "bouncer=$BOUNCER_LATEST" >> $GITHUB_OUTPUT

          echo "Latest Caddy: $CADDY_LATEST"
          echo "Latest CDP: $CDP_LATEST"
          echo "Latest Bouncer: $BOUNCER_LATEST"

      - name: Update Dockerfile
        id: update
        run: |
          CADDY="${{ steps.versions.outputs.caddy }}"
          CDP="${{ steps.versions.outputs.cdp }}"
          BOUNCER="${{ steps.versions.outputs.bouncer }}"

          # Validate all variables before touching Dockerfile
          for ver in "$CADDY" "$CDP" "$BOUNCER"; do
            if [ -z "$ver" ] || [ "$ver" = "null" ] || ! [[ "$ver" =~ ^[0-9]+ ]]; then
              echo "Error: Invalid version detected ('$ver'), aborting update." >&2
              exit 1
            fi
          done

          # Read current versions from Dockerfile
          CURRENT_CADDY=$(grep -oP '^ARG CADDY_VERSION=\K.*' Dockerfile)
          CURRENT_CDP=$(grep -oP '^ARG CDP_VERSION=\K.*' Dockerfile)
          CURRENT_BOUNCER=$(grep -oP '^ARG BOUNCER_VERSION=\K.*' Dockerfile)

          UPDATED=false

          if [ "$CADDY" != "$CURRENT_CADDY" ]; then
            sed -i "s/^ARG CADDY_VERSION=.*/ARG CADDY_VERSION=$CADDY/" Dockerfile
            UPDATED=true
          fi

          if [ "$CDP" != "$CURRENT_CDP" ]; then
            sed -i "s/^ARG CDP_VERSION=.*/ARG CDP_VERSION=$CDP/" Dockerfile
            UPDATED=true
          fi

          if [ "$BOUNCER" != "$CURRENT_BOUNCER" ]; then
            sed -i "s/^ARG BOUNCER_VERSION=.*/ARG BOUNCER_VERSION=$BOUNCER/" Dockerfile
            UPDATED=true
          fi

          TAG_NAME="v${CDP}"
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1 || git ls-remote --tags origin "refs/tags/$TAG_NAME" | grep -q "$TAG_NAME"; then
            TAG_NAME="v${CDP}-caddy${CADDY}-bouncer${BOUNCER}"
          fi

          if git rev-parse "$TAG_NAME" >/dev/null 2>&1 || git ls-remote --tags origin "refs/tags/$TAG_NAME" | grep -q "$TAG_NAME"; then
            TAG_NAME="v${CDP}-caddy${CADDY}-bouncer${BOUNCER}-$(date +%Y%m%d%H%M%S)"
          fi

          echo "updated=$UPDATED" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.update.outputs.updated == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Dockerfile
          git commit -m "chore: bump versions in Dockerfile (${{ steps.update.outputs.tag_name }})"
          git tag "${{ steps.update.outputs.tag_name }}"
          git push origin main
          git push origin "${{ steps.update.outputs.tag_name }}"

  publish-image:
    needs: update-versions
    if: needs.update-versions.outputs.updated == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      version_tag: ${{ needs.update-versions.outputs.tag_name }}
